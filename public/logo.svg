<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .hexagon-border { fill: #ffffff; stroke: #111116; stroke-width: 14; stroke-linejoin: bevel; }
      .accent-line { stroke: #111116; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .text-sub { font-family: 'Outfit', 'Arial Black', sans-serif; font-size: 16px; font-weight: 800; fill: #111116; letter-spacing: 2px; }
      .text-main { font-family: 'Outfit', 'Arial Black', sans-serif; font-size: 48px; font-weight: 900; fill: #111116; letter-spacing: 1px; }
      .icon-fill { fill: #111116; }
    </style>
  </defs>

  <!-- Outer Hexagon Crest -->
  <polygon points="200,20 365,105 365,295 200,380 35,295 35,105" class="hexagon-border" />

  <!-- Top Kettlebell Icon -->
  <g transform="translate(182, 60)">
    <!-- Kettlebell handle -->
    <path d="M 10 2 C 10 2, 26 2, 26 2 C 30 2, 33 6, 33 11 L 33 18 C 33 21, 30 23, 26 23 L 10 23 C 6 23, 3 21, 3 18 L 3 11 C 3 6, 6 2, 10 2 Z" fill="none" stroke="#111116" stroke-width="4.5" />
    <!-- Kettlebell body -->
    <circle cx="18" cy="27" r="16" fill="#111116" />
  </g>

  <!-- Upper Dashed Divider Line -->
  <line x1="75" y1="135" x2="325" y2="135" class="accent-line" />

  <!-- Subtitle Text -->
  <text x="200" y="162" text-anchor="middle" class="text-sub">HIGH INTENSITY FUNCTIONAL TRAINING</text>

  <!-- Main Brand Title -->
  <text x="200" y="222" text-anchor="middle" class="text-main">IRON BOX</text>

  <!-- Lower Dashed Divider Line -->
  <line x1="75" y1="248" x2="325" y2="248" class="accent-line" />

  <!-- Bottom Dumbbell / Barbell Icon -->
  <g transform="translate(170, 274)">
    <!-- Bar -->
    <rect x="15" y="10" width="30" height="5" rx="2.5" fill="#111116" />
    <!-- Inner weights -->
    <rect x="19" y="4" width="4" height="17" rx="2" fill="#111116" />
    <rect x="37" y="4" width="4" height="17" rx="2" fill="#111116" />
    <!-- Outer weight plates -->
    <rect x="11" y="2" width="6" height="21" rx="2.5" fill="#111116" />
    <rect x="43" y="2" width="6" height="21" rx="2.5" fill="#111116" />
  </g>
</svg>

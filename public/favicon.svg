<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <polygon points="50,6 92,27 92,73 50,94 8,73 8,27" fill="#ffffff" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="bevel" />
  
  <!-- Kettlebell top -->
  <circle cx="50" cy="24" r="7" fill="#111116" />
  
  <!-- Iron Box Text -->
  <text x="50" y="47" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#111116">HIFT</text>
  <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#111116">IRON</text>
  <text x="50" y="75" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="url(#shieldGrad)">BOX</text>
  
  <!-- Dumbbell bottom -->
  <rect x="36" y="80" width="28" height="3" fill="#111116" rx="1.5" />
</svg>